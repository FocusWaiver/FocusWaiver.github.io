<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cryptex Puzzle</title>
</head>
<body>
    <h1> Feel like you can solve the puzzle?</h1>
    <p>Guess the 5-letter word and you win!</p>
    <p>2 points for correct letter in position. 1 point for letter out of position</p>
    <p>(Letters in position will not be counted twice)</p>
    <input type="text" id="guess" placeholder="Type here..." />
    <button id="guess-button">Guess</button>
    <div id="output"></div>
    
    <script>
        document.getElementById("guess-button").addEventListener("click", async () => {
            const guessInput = document.getElementById("guess");
            const outputDiv = document.getElementById("output");
            const userGuess = guessInput.value.trim();

            outputDiv.textContent = "Please be patient, I'm cheap, and the first guess may take 30-60 seconds to process.";

            try {
                const response = await fetch ("https://cryptexsafe.onrender.com/process_guess", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify ({guess: userGuess})
                });

                const result = await response.json();
                if (result.winner) {
                    outputDiv.textContent = "Congratulations!! You are correct!";
                } else {
                    outputDiv.textContent = `Your guess scored: ${result.score}, Try Again.`;
                }
            } catch (err) {
                outputDiv.textContent = "Something went wrong. Try again.";
                console.error("Error checking guess:", err);
            }
        });       
    </script>
</body>
</html>
